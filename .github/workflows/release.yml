name: Release

# Tag-triggered ONLY, deliberately. A workflow_dispatch or branch run would publish an
# image whose provenance subject is `@refs/heads/...` rather than `@refs/tags/...`, and
# consumers that verify provenance pin the tag subject.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  E2E_RCLONE_VERSION: v1.75.1

jobs:
  # Re-run the suite on the tagged commit rather than trusting a green branch build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet -tags e2e ./...
      - run: go test -race -count=1 ./...
      - name: Install rclone ${{ env.E2E_RCLONE_VERSION }}
        run: |
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/${E2E_RCLONE_VERSION}/rclone-${E2E_RCLONE_VERSION}-linux-amd64.zip"
          unzip -q -j rclone.zip '*/rclone' -d "$RUNNER_TEMP/rclone"
          echo "RCLONE_BIN=$RUNNER_TEMP/rclone/rclone" >> "$GITHUB_ENV"
      - run: go test -tags e2e -count=1 -run TestE2E ./internal/shim

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Fulcio)
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rclone-metrics-shim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The builder stage cross-compiles on the runner's own architecture,
          # so the second platform costs seconds and needs no emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

      # In-toto SLSA provenance published as an OCI referrer alongside the image.
      # push-to-registry lets admission controllers resolve it from the registry.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/sharkusmanch/rclone-metrics-shim:vX.Y.Z --owner sharkusmanch
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rclone-metrics-shim
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "If this is the first release, set the GHCR package visibility to **public**."
          } >> "$GITHUB_STEP_SUMMARY"
