name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The rclone release the end-to-end tests drive through the shim.
  RCLONE_VERSION: v1.75.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags e2e ./...
      - run: go test -race -count=1 ./...
      # The module claims go 1.22; make sure it still builds there.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install rclone ${{ env.RCLONE_VERSION }}
        run: |
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-linux-amd64.zip"
          unzip -q -j rclone.zip '*/rclone' -d "$RUNNER_TEMP/rclone"
          "$RUNNER_TEMP/rclone/rclone" version
          echo "RCLONE_BIN=$RUNNER_TEMP/rclone/rclone" >> "$GITHUB_ENV"
      - run: go test -tags e2e -count=1 -run TestE2E -v ./internal/shim

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
      - name: Smoke test the image
        run: |
          docker build -t shim:test .
          test "$(docker run --rm shim:test version)" = "dev"
          docker run --rm -v "$PWD/out:/out" --user "$(id -u):$(id -g)" shim:test install /out/sbin/rclone
          test -x out/sbin/rclone
